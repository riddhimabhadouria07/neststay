<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — NestStay PG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><header class="navbar"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-house"></i></span><span>NestStay <small>PG</small></span></a><a class="text-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to website</a></header>
<main class="auth-page"><div class="auth-card"><div class="auth-brand"><span class="brand-mark"><i class="fa-solid fa-house"></i></span><span>NestStay <small>PG</small></span></div><span class="eyebrow">Welcome back</span><h1>Sign in to your account</h1><p>Track your application, booking and payment status.</p><div class="auth-tabs"><button class="active">Student Login</button><button onclick="location.href='admin.html'">Admin Login</button></div><form id="loginForm"><label>Email or phone<input name="login" required placeholder="you@example.com"></label><label>Password<div class="password-field"><input name="password" type="password" required placeholder="••••••••"><button type="button" id="showPassword"><i class="fa-solid fa-eye"></i></button></div></label><div class="form-inline"><label class="checkbox"><input type="checkbox"> <span>Remember me</span></label><a href="#" class="text-link">Forgot password?</a></div><button class="btn btn-primary btn-lg full-btn">Login <i class="fa-solid fa-arrow-right"></i></button></form><p class="auth-bottom">New to NestStay? <a href="registration.html">Register now</a></p></div></main><div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span></span></div><script src="js/main.js"></script><script>document.getElementById('showPassword').addEventListener('click',()=>{const i=document.querySelector('[name=password]');i.type=i.type==='password'?'text':'password'});document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('neststayLoggedIn','true');showToast('Demo login successful');setTimeout(()=>location.href='dashboard.html',700)});</script></body></html>
